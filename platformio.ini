; PlatformIO 项目配置 — Baby Cry Monitor ESP32 固件
; 使用 VS Code「PlatformIO IDE」扩展打开本仓库即可编译烧录（Ctrl+Alt+U）
;
; 说明：
;   - 源码沿用现有 Arduino sketch 目录 arduino/baby_cry_detector/，无需改动文件结构
;   - 目录下有多个子工程（各自带 setup/loop），各环境用 src_filter 只编译自己的文件
;   - 代码使用旧版 I2S 驱动 driver/i2s.h，必须用 arduino-esp32 2.0.x，
;     对应 platform espressif32 6.x（升级到 3.x 需迁移 ESP_I2S.h）

[platformio]
src_dir = arduino/baby_cry_detector
default_envs = baby_cry_detector

[env:baby_cry_detector]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; babyCry_inferencing Edge Impulse 推理库所在目录（两台开发机各一条，缺失的目录会被跳过）
lib_extra_dirs =
  D:/ArduinoProject/libraries
  /Users/sheldon/Documents/Arduino/libraries
; BLE + WiFi + EI 模型较大，用 3MB App 分区（无 OTA）；如需与 Arduino IDE 默认分区一致改回 default.csv
board_build.partitions = huge_app.csv
; .ino 会被 PlatformIO 转成临时 .ino.cpp 再编译，src_filter 必须匹配转换后的文件名
build_src_filter =
  -<*>
  +<baby_cry_detector.ino*>
  +<ble_provision.*>
  +<wifi_connect.*>
  +<led.*>
  +<config.h>
; 开发板走原生 USB 串口（Arduino IDE 里勾了 USB CDC On Boot）时取消下面两行注释：
; build_flags =
;   -DARDUINO_USB_MODE=1
;   -DARDUINO_USB_CDC_ON_BOOT=1

; ============ 其他子工程（按需烧录） ============

[env:audio_app]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; 子工程 .ino 在子目录里，PlatformIO 不转换；经 audio_app_pio.cpp（带
; PLATFORMIO 守卫，Arduino IDE 下为空）引入，Arduino IDE 直开子目录不受影响
lib_extra_dirs =
  D:/ArduinoProject/libraries
  /Users/sheldon/Documents/Arduino/libraries
build_src_filter =
  -<*>
  +<audio_app/audio_app_pio.cpp>

[env:ble_test]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; BLE 配网测试（含真实 WiFi 连接），广播名 BabyMonitor-TEST
lib_extra_dirs =
  D:/ArduinoProject/libraries
  /Users/sheldon/Documents/Arduino/libraries
build_src_filter =
  -<*>
  +<ble_test/ble_test_pio.cpp>

[env:ble_echo_test]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; BLE 串口回显测试，广播名 BabyMonitor-ECHO
lib_extra_dirs =
  D:/ArduinoProject/libraries
  /Users/sheldon/Documents/Arduino/libraries
build_src_filter =
  -<*>
  +<ble_echo_test/ble_echo_test_pio.cpp>
