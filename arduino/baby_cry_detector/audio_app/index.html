<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>宝宝哭声数据采集</title>
<style>
  :root { --bg:#0f1420; --card:#1a2133; --fg:#e8ecf4; --dim:#8a94a8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,"PingFang SC",sans-serif; padding:16px; max-width:480px; margin:0 auto; }
  h1 { font-size:20px; margin:8px 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:12px; }
  #status { font-size:14px; padding:8px 12px; border-radius:8px; background:var(--card); margin-bottom:12px; }
  .barwrap { height:12px; background:#0b101c; border-radius:6px; overflow:hidden; }
  #bar { height:100%; width:0%; background:linear-gradient(90deg,#4caf50,#ff9800,#f44336); transition:width .2s; }
  #rms { font-size:12px; color:var(--dim); margin-top:6px; display:block; }
  .cats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  button { border:0; border-radius:12px; padding:16px 8px; font-size:15px; color:#fff; cursor:pointer; }
  button:active { transform:scale(.96); }
  .cat { opacity:.45; } .cat.active { opacity:1; outline:3px solid #fff; }
  .c { background:#e05b5b; } .b { background:#5b9fe0; }
  .s { background:#5bd08a; } .n { background:#8a8fa3; }
  .recbtns { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  .start { background:#e05b5b; } .stop { background:#4caf50; }
  .stopmm { width:100%; background:#f39c12; margin:0 0 12px; font-size:14px; padding:14px 8px; }
  .zip { width:100%; background:#6c5ce7; margin:0 0 12px; font-size:14px; padding:14px 8px; }
  button[disabled] { opacity:.4; }
  .cnt { font-size:12px; opacity:.85; }
  .hint { color:var(--dim); font-size:13px; line-height:1.6; }
  .hint em { color:var(--fg); font-style:normal; }
  #log { margin-top:10px; font-size:12px; color:var(--dim); white-space:pre-wrap; max-height:120px; overflow:auto; }
</style>
</head>
<body>
<h1>🎤 宝宝哭声数据采集</h1>
<div class="sub">选分类 → 开始录音 → 停止并下载（或停止并存内存稍后打包）</div>
<div class="card">
  <div class="barwrap"><div id="bar"></div></div>
  <span id="rms">实时电平 RMS: —</span>
</div>
<div class="cats">
  <button class="cat c active" data-cat="cry" onclick="setCat('cry')">😭 哭声<br><span class="cnt" id="cnt_cry">0</span></button>
  <button class="cat b" data-cat="babble" onclick="setCat('babble')">👶 哼唧/咿呀<br><span class="cnt" id="cnt_babble">0</span></button>
  <button class="cat s" data-cat="speech" onclick="setCat('speech')">🗣 说话/电视<br><span class="cnt" id="cnt_speech">0</span></button>
  <button class="cat n" data-cat="background" onclick="setCat('background')">🌫 背景噪声<br><span class="cnt" id="cnt_background">0</span></button>
</div>
<div class="recbtns">
  <button class="start" id="btnStart" onclick="startRec()">● 开始录音</button>
  <button class="stop" id="btnStop" onclick="stopAndSave()" disabled>■ 停止并保存</button>
</div>
<button class="stopmm" id="btnStopMem" onclick="stopToMemory()" disabled>🗂 停止并存内存（等待打包下载）</button>
<button class="zip" id="btnZip" onclick="downloadZip()">📦 打包下载全部（内存待打包 <span id="zipCount">0</span> 条）</button>
<div id="status">正在连接开发板...</div>
<div class="hint">
  录音时长不限（手动停止），时长 <em id="secs">0</em>s。<br>
  「停止并保存」直接下载到电脑，文件名 <em id="nameHint">cry_001.wav</em>；<br>
  「停止并存内存」等打包下载（按分类分文件夹的 zip）。<br>
  电平建议 RMS 200~8000：太低离开发板近一点，太高离远一点。
</div>
<div id="log"></div>

<script>
const SR = 16000;
let cat = 'cry';
let recording = false;
let stopMode = 'save';          // 'save' = 下载, 'memory' = 存内存
let ws = null;
let chunks = [];
let total = 0;
let counters = {};
let pendingClips = [];          // 内存待打包: {cat, name, data}
try { counters = JSON.parse(localStorage.getItem('bcCounters') || '{}'); } catch (e) {}
function updateCounters() {
  for (const k of ['cry','babble','speech','background'])
    document.getElementById('cnt_' + k).textContent = counters[k] || 0;
}
function updateZipCount() { document.getElementById('zipCount').textContent = pendingClips.length; }
function calcRms(s) { let sum = 0; for (const v of s) sum += v * v; return Math.sqrt(sum / s.length); }
function agcNormalize(s, t) {
  t = t || 2500;
  const rms = calcRms(s);
  let g = rms > 1 ? t / rms : 64;
  g = Math.max(0.25, Math.min(64, g));
  const o = new Int16Array(s.length);
  for (let i = 0; i < s.length; i++) { let v = s[i] * g; if (v > 32767) v = 32767; else if (v < -32768) v = -32768; o[i] = v; }
  return o;
}
function buildWav(s) {
  const n = s.length, buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
  dv.setUint32(0, 0x52494646, false);
  dv.setUint32(4, 36 + n * 2, true);
  dv.setUint32(8, 0x57415645, false);
  dv.setUint32(12, 0x666d7420, false);
  dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, SR, true); dv.setUint32(28, SR * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  dv.setUint32(36, 0x64617461, false);
  dv.setUint32(40, n * 2, true);
  new Int16Array(buf, 44, n).set(s);
  return buf;
}
function log(m) { document.getElementById('log').textContent += m + '\n'; }
function status(t, cls) { const e = document.getElementById('status'); e.textContent = t; e.className = cls || ''; }
function setCat(c) {
  cat = c;
  document.querySelectorAll('.cat').forEach(b => b.classList.toggle('active', b.dataset.cat === c));
  const nh = document.getElementById('nameHint');
  if (nh) nh.textContent = c + '_' + String((counters[c] || 0) + 1).padStart(3, '0') + '.wav';
}
function httpBase() { return 'http://' + location.host; }
function wsUrl() { return 'ws://' + location.host + '/ws'; }
async function httpGet(path, timeoutMs = 5000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(httpBase() + path, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) {
    clearTimeout(timer);
    throw e;
  }
}
function connect() {
  try { if (ws) ws.close(); } catch (e) {}
  ws = new WebSocket(wsUrl());
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { status('✅ 已连接开发板'); };
  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      return;  // 控制走 HTTP, WS 只传音频二进制
    } else if (recording) {
      chunks.push(new Int16Array(ev.data));
      total += ev.data.byteLength / 2;
      document.getElementById('secs').textContent = (total / SR).toFixed(0);
    }
  };
  ws.onclose = () => { recording = false; status('连接断开，重连中...'); setTimeout(connect, 2000); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
async function startRec() {
  if (!ws || ws.readyState !== 1 || recording) return;
  document.getElementById('btnStart').disabled = true;
  status('正在启动录音...');
  try {
    const j = await httpGet('/rec/start');
    log('启动录音 OK: ' + JSON.stringify(j));
  } catch (e) {
    status('启动失败: ' + e.message);
    log('⚠ 启动失败: ' + e.message);
    document.getElementById('btnStart').disabled = false;
    return;
  }
  chunks = []; total = 0;
  recording = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('btnStopMem').disabled = false;
  document.getElementById('secs').textContent = '0';
  status('录音中...');
}
function notifyStop() {
  // 异步通知固件停止 (不阻塞, 不依赖响应)
  fetch(httpBase() + '/rec/stop').catch(() => {});
}
function stopAndSave() {
  if (!recording) return;
  stopMode = 'save';
  recording = false;                    // 立即停止累积
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnStopMem').disabled = true;
  log('本地收到音频: ' + total + ' 样本 (' + (total / SR).toFixed(1) + 's)');
  finalize();                           // ← 同步: 在点击手势内构建并下载, 浏览器不会拦
  notifyStop();                         // 异步: 让固件停止推流
  document.getElementById('btnStart').disabled = false;   // ← 恢复开始按钮
  log('已通知固件停止');
}
function stopToMemory() {
  if (!recording) return;
  stopMode = 'memory';
  recording = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnStopMem').disabled = true;
  log('本地收到音频: ' + total + ' 样本 (' + (total / SR).toFixed(1) + 's)');
  finalizeToMemory();                   // 同步: 入内存
  notifyStop();
  document.getElementById('btnStart').disabled = false;   // ← 恢复开始按钮
  log('已通知固件停止');
}
function buildResult() {
  const all = new Int16Array(total);
  let off = 0;
  for (const c of chunks) { all.set(c, off); off += c.length; }
  const rms = calcRms(all);
  const norm = agcNormalize(all);
  const wav = buildWav(norm);
  return { wav, rms };
}
function nextName() {
  counters[cat] = (counters[cat] || 0) + 1;
  return cat + '_' + String(counters[cat]).padStart(3, '0') + '.wav';
}
function persistCounters() {
  try { localStorage.setItem('bcCounters', JSON.stringify(counters)); }
  catch (e) { log('⚠ localStorage 异常: ' + e.message); }
  updateCounters();
  setCat(cat);
}
function downloadWav(name, wav) {
  const blob = new Blob([wav], { type: 'audio/wav' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function finalize() {
  try {
    if (total < SR * 0.5) { status('录音太短'); chunks = []; total = 0; return; }
    log('finalize: 构建中 (total=' + total + ', chunks=' + chunks.length + ')');
    const { wav, rms } = buildResult();
    log('finalize: WAV 完成 (' + wav.byteLength + 'B)');
    const name = nextName();
    persistCounters();
    log('finalize: 下载 ' + name);
    downloadWav(name, wav);             // 同步下载, 手势内触发
    status('✔ 已保存并下载 ' + name + '（RMS ' + Math.round(rms) + '，' + (total / SR).toFixed(1) + 's）');
    log('✔ ' + name + ' 已下载');
  } catch (e) {
    status('保存异常: ' + (e && e.message || e));
    log('⚠ finalize 异常: ' + (e && e.message || e) + ' | ' + (e && e.stack || ''));
  }
  chunks = []; total = 0;
}
function finalizeToMemory() {
  if (total < SR * 0.5) { status('录音太短'); chunks = []; total = 0; return; }
  const { wav, rms } = buildResult();
  const name = nextName();
  persistCounters();
  pendingClips.push({ cat: cat, name: name, data: wav });
  updateZipCount();
  status('🗂 已存内存 ' + name + '（待打包 ' + pendingClips.length + ' 条，RMS ' + Math.round(rms) + '）');
  log('🗂 ' + name + '（存内存）');
  chunks = []; total = 0;
}
async function downloadZip() {
  if (pendingClips.length === 0) { status('没有待打包的音频'); return; }
  const n = pendingClips.length;
  try {
    // 让出一次事件循环: 上面的 /rms 轮询和 WebSocket 需要机会继续收发,
    // 否则打包期间主线程被占满, Chrome 会认为发起下载的页面失去响应.
    status('📦 正在打包 ' + n + ' 条...');
    await new Promise(r => setTimeout(r, 0));
    const zip = buildZip(pendingClips);
    const blob = new Blob([zip], { type: 'application/zip' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'babycry_' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.zip';
    document.body.appendChild(a); a.click(); a.remove();
    // 撤销 URL 必须等下载真正开始, 太早会让 Chrome 拿不到数据而卡在 .crdownload
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    pendingClips = [];
    updateZipCount();
    status('✔ 已打包 ' + n + ' 条（' + (zip.byteLength / 1048576).toFixed(1) + 'MB），内存已清空');
    log('📦 已打包 ' + n + ' 条');
  } catch (e) {
    status('打包失败: ' + e.message, 'err');
    log('⚠ 打包失败: ' + e.message);
  }
}
setInterval(async () => {
  try { const r = await fetch('/rms'); const j = await r.json(); const rms = j.rms || 0;
    document.getElementById('bar').style.width = Math.min(100, rms / 160 * 100) + '%';
    document.getElementById('rms').textContent = '实时电平 RMS: ' + Math.round(rms);
  } catch (e) {}
}, 500);
updateCounters();
updateZipCount();
connect();

/* ZIP 打包 (stored 无压缩, 零依赖) */
let crcTable = null;
function crc32(buf) {
  if (!crcTable) {
    crcTable = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crcTable[n] = c >>> 0;
    }
  }
  const bytes = new Uint8Array(buf);
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = crcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function buildZip(clips) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;

  /* MS-DOS 时间/日期 (ZIP 头必需). date=0 是非法值(早于 1980-01-01),
     会让 Chrome 一直等不到完成信号, 下载卡在 .crdownload/0B/s. */
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  for (const clip of clips) {
    const fileName = clip.cat + '/' + clip.name;
    const nameBytes = enc.encode(fileName);
    const data = new Uint8Array(clip.data);
    const crc = crc32(clip.data);
    const lfh = new DataView(new ArrayBuffer(30));
    lfh.setUint32(0, 0x04034b50, true);
    lfh.setUint16(4, 20, true);
    lfh.setUint16(6, 0x0800, true);          // bit11: 文件名是 UTF-8
    lfh.setUint16(8, 0, true);               // 0 = stored 无压缩
    lfh.setUint16(10, dosTime, true);        // ← 原来漏写
    lfh.setUint16(12, dosDate, true);        // ← 原来漏写
    lfh.setUint32(14, crc, true);
    lfh.setUint32(18, data.length, true);
    lfh.setUint32(22, data.length, true);
    lfh.setUint16(26, nameBytes.length, true);
    lfh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lfh.buffer), nameBytes, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);               // version made by
    cd.setUint16(6, 20, true);               // version needed
    cd.setUint16(8, 0x0800, true);           // bit11: UTF-8
    cd.setUint16(10, 0, true);               // 0 = stored
    cd.setUint16(12, dosTime, true);         // ← 原来漏写
    cd.setUint16(14, dosDate, true);         // ← 原来漏写
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, nameBytes.length, true);
    cd.setUint16(30, 0, true);               // extra len
    cd.setUint16(32, 0, true);               // comment len
    cd.setUint16(34, 0, true);               // disk number start
    cd.setUint16(36, 0, true);               // internal attrs
    cd.setUint32(38, 0, true);               // external attrs
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), nameBytes);
    offset += 30 + nameBytes.length + data.length;
  }

  const cdSize = central.reduce((a, u) => a + u.length, 0);
  parts.push(...central);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(4, 0, true);                // 本磁盘号
  eocd.setUint16(6, 0, true);                // 中央目录起始磁盘
  eocd.setUint16(8, clips.length, true);     // 本磁盘条目数
  eocd.setUint16(10, clips.length, true);    // 总条目数
  eocd.setUint32(12, cdSize, true);
  eocd.setUint32(16, offset, true);
  eocd.setUint16(20, 0, true);               // 注释长度
  parts.push(new Uint8Array(eocd.buffer));

  const tsize = parts.reduce((a, u) => a + u.length, 0);
  const out = new Uint8Array(tsize);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out.buffer;
}

/* 刷新/关闭拦截: 内存还有待打包音频时提示 */
window.addEventListener('beforeunload', (e) => {
  if (pendingClips.length > 0) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
</body>
</html>
