# pnpm 12 的项目级配置（package.json 的 pnpm 字段已废弃）
# allowBuilds：true = 允许该依赖跑 install 脚本（esbuild/ttf2woff2/vue-demi 必须放行）
# 三项安全设置为 @uni-helper/eslint-config 的 pnpm/yaml-enforce-settings 规则强制要求
# trustPolicyExclude：trustPolicy 对锁文件里的正常旧版本会误报 possible takeover，逐个豁免
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@uni-helper/uni-types@1.3.0'
  - '@vitejs/plugin-legacy@5.3.2'
  - chokidar@4.0.3
  - semver@6.3.1

shellEmulator: true

allowBuilds:
  core-js: false
  core-js-pure: false
  es5-ext: false
  esbuild: true
  ttf2woff2: true
  vue-demi: true
